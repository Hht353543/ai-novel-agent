services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: ai-novel-agent-backend
    ports:
      # 默认仅本机可访问；需要局域网访问时设置 ALLOW_LAN=0.0.0.0
      - "${ALLOW_LAN:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    volumes:
      - ../backend/knowledge:/app/knowledge   # 挂载知识库，便于热更新
      - ../backend/data:/app/data             # 持久化项目与压缩缓存
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: ai-novel-agent-frontend
    ports:
      - "${ALLOW_LAN:-127.0.0.1}:5173:5173"
    environment:
      # 容器内 Vite 需绑定所有接口，才能被宿主机端口映射转发；对外暴露由上面的 ports 控制
      - VITE_HOST=0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
