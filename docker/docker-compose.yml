services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: ai-novel-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../backend/knowledge:/app/knowledge   # 挂载知识库，便于热更新
      - ../backend/data:/app/data             # 持久化项目与压缩缓存
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: ai-novel-agent-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
